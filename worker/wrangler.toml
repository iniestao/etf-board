name = "etf-board"
main = "src/index.js"
compatibility_date = "2024-11-01"

# 免费版即可运行：10 万请求/天，无休眠
# 部署：npx wrangler deploy
#
# 注意：Workers 和 KV 都**不需要绑卡**。整份配置里唯一要绑卡的是 R2，
# 而 R2 在这里是可选的——历史数据默认走 GitHub 的 data 分支。

# ---------------------------------------------------------------- 历史数据源
# 当前配置：GitHub 仓库的 data 分支（已部署验证可用）
#
# Actions 每天跑完把 dist/hist + manifest.json 推到 data 分支，
# Worker 从这里读，边缘缓存 6 小时。不绑卡、不配 secret。
#
# 仓库必须**公开**：raw.githubusercontent.com 对匿名请求读私有仓库一律返回 404。
# 如果一定要用私有仓库，就再配一个只读令牌（见 README 5.2 末尾），
# Worker 会自动改走 api.github.com 取原始字节。

[vars]
HIST_BASE = "https://raw.githubusercontent.com/iniestao/etf-board/data"

# ---------------------------------------------------------------- 访问口令（必填）
# 站点默认是「公开可访问」的，任何拿到 workers.dev 地址的人都能打开。
# 想在公开网络上锁住，必须设一个 ACCESS_PASS：
#
#   npx wrangler secret put ACCESS_PASS          # 命令行，交互输入，最推荐
#   或 Dashboard → Workers → etf-board → Settings → Variables → 添加 ACCESS_PASS
#
# 设好之后，未登录访问只会看到一个口令输入框，HTML 和 /api/* 全部拿不到。
# 口令通过后浏览器记一年（HttpOnly Cookie，值为 HMAC，不可伪造）。
#
# 注意：**不要**把这个口令写到本文件的 [vars] 里。仓库是公开的，
# 写在这里等于把密码连同代码一起发布出去。secret 不会出现在仓库中。
# 没设 ACCESS_PASS 时整站拒绝服务（返回一张设置说明页），这是有意为之。
#
# 想让口令立即失效（换口令 / 怀疑泄露）：重设一次 ACCESS_PASS 即可，
# 所有旧 Cookie 由新口令重新推导，立刻全部作废。

# 可选：私有仓库才需要。用 wrangler secret put GITHUB_TOKEN 设置，
# 不要写在这个文件里（会被提交进仓库）。
# [vars]
# GITHUB_TOKEN = "不要写在这里"

# 方案 2（可选，更快）：R2
#   需要绑卡开通（额度内不扣费）。绑了 R2 就优先用 R2，HIST_BASE 自动失效。
#   npx wrangler r2 bucket create etf-data
#
# [[r2_buckets]]
# binding = "BUCKET"
# bucket_name = "etf-data"

# ---------------------------------------------------------------- 自选跨设备
# KV 免费、不用绑卡。不开就退回 localStorage，换浏览器会丢自选。

[[kv_namespaces]]
binding = "WATCH"
id = "433b04a19510470ca9e54a778cd2b598"

# ---------------------------------------------------------------- 每日 PCF 预热
# 交易所的申购赎回清单（PCF）每天开盘前换一次、盘中不变。所以不在盘中现场拉，
# 而是每天早上把当天要用的那批抓一遍存进 KV，盘中只读 KV。
#
# 开跑时间跟着交易所的公布时间走，不凭感觉：
#   · 上交所官网「ETF公告申购赎回清单」栏目，交易日 **08:30** 统一更新
#     （2011-12-12 起执行；官网另注明 08:00 后证通云盘已有公告文件）
#   · 深交所的清单是静态文件，按日命名，实测每天 **08:11–08:12** 生成
#     （HTTP Last-Modified：11-04 是 00:11:50 GMT，11-05 是 00:12:11 GMT）
# 所以 08:35 开跑，比两所公布时间都晚一点，抓到的就是今天的清单。
#
# Cron 用的是 **UTC**，下面两行合起来 = 北京时间 08:35–15:59，周一到周五：
#   "35-59 0 * * 1-5" → UTC 周一至周五 00:35–00:59 = 北京 08:35–08:59
#   "* 1-7 * * 1-5"   → UTC 周一至周五 01:00–07:59 = 北京 09:00–15:59
#
# 每轮 20~25 只，472 只约 22 轮（22 分钟），08:57 前后铺完，赶在 09:30 开盘前。
# 抓完之后每轮只读一次进度就返回。
#
# 为什么不更早：07:00 开跑拿到的一定是昨天那份，等于早上先抓一遍昨天、等今天
# 的发布再归零重抓一遍——一天抓两遍，白烧一倍请求。宁可从 08:35 开始抓一次对的。
#
# 部署后可在 Dashboard → Workers → etf-board → Settings → Trigger Events
# 里看到它；命令行 `npx wrangler deploy` 也会自动注册。
[triggers]
# 预热节奏：UTC 0-7 点 = 北京 8-15 点，每 5 分钟一轮。
# 原来是「0 点段 35-59 每分钟」+「1-7 点段每分钟」，一天 445 次；
# 每轮至少写 1 次进度、抓货时还要写 3~4 个分片，光预热一天就一千多次写，
# 加上 /api/all 快照和 /api/mkt 快照，直接把 KV 免费额度（1000 写/天）打爆，
# 2026-11-09 凌晨账户被整体 block 过一次。现在降到 5 分钟一轮（96 次/天）。
crons = ["*/5 0-7 * * 1-5"]
