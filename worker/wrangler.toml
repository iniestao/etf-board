name = "etf-board"
main = "src/index.js"
compatibility_date = "2024-11-01"

# 免费版即可运行：10 万请求/天，无休眠
# 部署：npx wrangler deploy
#
# 注意：Workers 和 KV 都**不需要绑卡**。整份配置里唯一要绑卡的是 R2，
# 而 R2 在这里是可选的——历史数据默认走 GitHub 的 data 分支。

# ---------------------------------------------------------------- 历史数据源
# 当前配置：GitHub 仓库的 data 分支（已部署验证可用）
#
# Actions 每天跑完把 dist/hist + manifest.json 推到 data 分支，
# Worker 从这里读，边缘缓存 6 小时。不绑卡、不配 secret。
#
# 仓库必须**公开**：raw.githubusercontent.com 对匿名请求读私有仓库一律返回 404。
# 如果一定要用私有仓库，就再配一个只读令牌（见 README 5.2 末尾），
# Worker 会自动改走 api.github.com 取原始字节。

[vars]
HIST_BASE = "https://raw.githubusercontent.com/iniestao/etf-board/data"

# 可选：私有仓库才需要。用 wrangler secret put GITHUB_TOKEN 设置，
# 不要写在这个文件里（会被提交进仓库）。
# [vars]
# GITHUB_TOKEN = "不要写在这里"

# 方案 2（可选，更快）：R2
#   需要绑卡开通（额度内不扣费）。绑了 R2 就优先用 R2，HIST_BASE 自动失效。
#   npx wrangler r2 bucket create etf-data
#
# [[r2_buckets]]
# binding = "BUCKET"
# bucket_name = "etf-data"

# ---------------------------------------------------------------- 自选跨设备
# KV 免费、不用绑卡。不开就退回 localStorage，换浏览器会丢自选。

[[kv_namespaces]]
binding = "WATCH"
id = "433b04a19510470ca9e54a778cd2b598"
