name: 更新 ETF 数据

# 每个交易日收盘后自动跑：拉数据 → 算因子 → 传 R2
# 手动触发：Actions 页面点 Run workflow

on:
  schedule:
    # GitHub 的 cron 是 UTC。北京时间 16:35 = UTC 08:35
    # 收盘 15:00 + 数据源清洗延迟，留 1.5 小时余量
    - cron: '35 8 * * 1-5'
  workflow_dispatch:        # 支持手动跑，改因子后不用等定时

concurrency:
  group: etf-update           # 防止上次没跑完又触发新的
  cancel-in-progress: false

# 往 data 分支 push 需要写权限；不声明的话默认只读，push 会 403
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # ---------- 1. 拉全市场历史数据 ----------
      # node:sqlite 是 Node 22+ 内置，不需要装任何依赖
      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 拉取日线（1717 只，约 9 分钟）
        working-directory: data
        run: node import_etf.mjs --out etf.db --delay 60
        env:
          NODE_NO_WARNINGS: '1'

      - name: 数据完整性断言
        working-directory: data
        run: |
          python3 - <<'PY'
          import sqlite3, sys
          db = sqlite3.connect('etf.db')
          n_etf = db.execute('SELECT COUNT(*) FROM etf_meta').fetchone()[0]
          n_row = db.execute('SELECT COUNT(*) FROM etf_daily').fetchone()[0]
          last  = db.execute('SELECT MAX(date) FROM etf_daily').fetchone()[0]
          print(f'ETF {n_etf} 只 / 日线 {n_row:,} 条 / 最新 {last}')
          # 数据集在 2026-11 约 1717 只；低于 1500 只说明上游大面积失败，
          # 宁可让流水线红掉，也不要把残缺数据覆盖到线上
          assert n_etf > 1500, f'ETF 数量异常: {n_etf}'
          assert n_row > 1_200_000, f'日线数量异常: {n_row}'
          PY

      # ---------- 2. 算指标与因子 ----------
      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          # 必须指定依赖文件，否则 setup-python 算不出 cache key 会直接失败
          cache: pip
          cache-dependency-path: alpha/requirements.txt

      - name: 安装依赖
        run: pip install -r alpha/requirements.txt

      - name: 计算 56 指标 + 101 因子（约 4 分钟）
        working-directory: alpha
        run: python -u compute.py --db ../data/etf.db --out ../dist

      # 因子值每天重算：compute.py 已经把 101 个因子在 1717 只上全部重算过一遍。
      # 但「因子研究」页面的 IC 检验和样本外回测还要再跑这一步——
      # 它读 dist/etf/*.parquet 做横截面相关聚类，产出入选组合与回测表。
      - name: 因子聚类与样本外回测
        working-directory: alpha
        run: python -u select_factors.py --dist ../dist

      - name: 生成页面用的研究数据（5KB）
        run: node tools/gen_research.mjs

      - name: 输出体积检查
        run: |
          du -sh dist dist/etf dist/hist
          python3 - <<'PY'
          import json, pathlib
          m = json.loads(pathlib.Path('dist/manifest.json').read_text())
          h = m.get('hist') or {}
          print(f"标的 {m['codes']} 只 / 字段 {m['field_count']} 个 / 最新 {m['last_trade_date']}")
          print(f"历史二进制 {h.get('files')} 个 / {h.get('bytes',0)/1024/1024:.1f} MB / 格式 {h.get('format')} / 列 {len(h.get('cols') or [])}")
          # 历史面板依赖这份文件，缺了页面会静默没图，所以在 CI 里就卡住
          assert h.get('format') == 'ETH1', 'hist 格式标记缺失'
          assert h.get('files') == m['codes'], f"hist 文件数 {h.get('files')} != 标的数 {m['codes']}"
          assert h.get('bytes', 0) > 10e6, 'hist 总体积异常偏小'
          PY

      # 板块地图要的两份「历史」，都不依赖任何人打开页面：
      #   sec_daily.json  —— 90 天 × 36 格的绝对成交额（资金箭头的基准）
      #   mkt_hist.json   —— 250 天的全 A 集中度 / 宽度（四象限的散点云）
      # 后者是逐只个股回算的：5563 只 A 股各拉一次日 K，8 并发约 1-2 分钟。
      # 以前前者靠浏览器收盘后写 KV（没人开页面就没那天），后者靠手动跑脚本提交源码。
      # 这两步是「锦上添花」，不能因为它失败把整个数据发布带下来——
      # 东财的板块接口限流比 ETF 行情狠，被限一次就红掉，等于当天的 K 线也没了。
      # 失败就沿用 data 分支上上一次的那份，页面照常显示（只是那天的点不动）。
      - name: 回算板块日档与全 A 结构
        continue-on-error: true
        run: |
          node pipeline/gen_sec_hist.mjs --json-only || echo "::warning::日档回算失败，沿用上一次发布的那份"
          node pipeline/gen_mkt_hist.mjs || echo "::warning::全A结构回算失败，沿用上一次发布的那份"
          python3 - <<'PY'
          import json, pathlib
          d = json.loads(pathlib.Path('dist/sec_daily.json').read_text())
          m = json.loads(pathlib.Path('dist/mkt_hist.json').read_text())
          print(f"日档 {len(d['days'])} 天 × {len(d['days'][-1]['s'])} 格，最新 {d['last_trade_date']}")
          print(f"全A结构 {len(m['d'])} 天，行业 {m['inds']} 个，最新 {m['last_trade_date']}，"
                f"{m['u'][-1]} 涨 {m['w'][-1]} 跌")
          assert len(d['days']) >= 60, '日档不足 60 天'
          assert len(m['d']) >= 200, '全A结构历史不足 200 天'
          # 家数数组和日期必须同长，否则前端按索引取会错位到别的日子
          assert len(m['u']) == len(m['d']) and len(m['w']) == len(m['d']), '涨跌家数与日期长度不一致'
          # 全 A 有成交的股票常年在 4500-5500 之间。低于 3000 说明上游限流捞漏了
          assert m['u'][-1] + m['w'][-1] > 3000, f"个股家数异常偏少 {m['u'][-1]}+{m['w'][-1]}"
          PY

      # 跟踪指数映射是盯盘页"同指数去重"的依据，季度手动更新一次即可
      # （node pipeline/fetch_index_map.mjs && node pipeline/gen_idx_data.mjs，然后重新部署）。
      # 这里只做覆盖度体检：新 ETF 上市会让覆盖率慢慢下滑，低于阈值就该重跑了。
      - name: 指数映射覆盖率检查
        run: |
          python3 - <<'PY'
          import json, pathlib, sys
          man = json.loads(pathlib.Path('dist/manifest.json').read_text())
          idx = json.loads(pathlib.Path('pipeline/index_map.json').read_text())['map']
          codes = [it['code'] for it in man['items']]
          hit = sum(1 for c in codes if (idx.get(c) or {}).get('idx'))
          rate = hit / len(codes)
          print(f'跟踪指数已知 {hit}/{len(codes)} = {rate:.1%}')
          if rate < 0.90:
              print('::warning::覆盖度低于 90%，重跑 pipeline/fetch_index_map.mjs 并重新部署 Worker')
          PY

      # ---------- 3. 发布历史数据 ----------
      # 默认走 GitHub 自己的 data 分支：不需要 R2、不需要绑卡、不需要配 secret。
      # 每次都是「孤儿单提交 + force push」，所以仓库不会一天涨 62MB。
      # Worker 用 HIST_BASE 指向这个分支的 raw 地址即可。
      - name: 发布到 data 分支
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          PUB=/tmp/pub
          mkdir -p "$PUB"
          cp -r dist/hist "$PUB/"
          cp dist/manifest.json "$PUB/"
          cp dist/research.json "$PUB/"
          # 首次跑或回算失败时这两个文件可能不存在，别让 cp 把发布带崩
          cp dist/sec_daily.json dist/mkt_hist.json "$PUB/" 2>/dev/null || true
          cd "$PUB"
          git init -q
          git config user.name "etf-board-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "data $(date -u '+%Y-%m-%d %H:%M UTC')"
          git branch -M data
          git push -q --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
          echo "data 分支 $(git rev-parse --short HEAD)，$(du -sh "$PUB" | cut -f1)，" \
               "$(ls "$PUB"/hist | wc -l) 个 hist"
          python3 -c "import json;d=json.load(open('$PUB/research.json'));print('因子研究数据:',d['generated_at'],'因子',d['ic']['n'],'个')"

      # ---------- 4. 可选：同步到 R2 ----------
      # 只有在仓库变量 USE_R2=true（且配了那 4 个 secret）时才跑。
      # R2 比 GitHub raw 快，但开通要绑卡——不绑卡就跳过，不影响任何功能。
      - name: 同步到 Cloudflare R2（可选）
        if: ${{ vars.USE_R2 == 'true' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          aws s3 sync dist/ "s3://$R2_BUCKET/" \
            --endpoint-url "$R2_ENDPOINT" \
            --no-progress \
            --exclude "*.pyc"

      - name: 汇总
        if: always()
        run: |
          {
            echo "### ETF 数据更新"
            echo "- 时间：$(date -u '+%Y-%m-%d %H:%M UTC')"
            echo "- 产物：$(du -sh dist 2>/dev/null | cut -f1)"
            echo "- 状态：${{ job.status }}"
          } >> $GITHUB_STEP_SUMMARY
