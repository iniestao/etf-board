name: 更新 ETF 数据

# 每个交易日收盘后自动跑：拉数据 → 算因子 → 补跟踪指数映射 → 传 data 分支
# 映射有新增时会顺带把新分组重新部署到 Worker（见第 5 段），其余情况不碰线上。
# 手动触发：Actions 页面点 Run workflow

on:
  schedule:
    # 两批。GitHub 的 cron 是 UTC，+8 才是北京：
    #   08:35 UTC = 北京 16:35  主批次
    #   13:00 UTC = 北京 21:00  兜底批次
    # 加第二批是因为单点失败会直接丢一天，而深市份额断了就再也补不回来。
    # 兜底批次先跑 probe 判断数据是否已齐，齐了立刻结束（约 30 秒），
    # 不齐才整条重跑。仓库是公开的，Actions 分钟数不计费，成本只在时间。
    - cron: '35 8 * * 1-5'
    - cron: '0 13 * * 1-5'
  workflow_dispatch:        # 支持手动跑，改因子后不用等定时

concurrency:
  group: etf-update           # 防止上次没跑完又触发新的
  cancel-in-progress: false

# 往 data 分支 push 需要写权限；不声明的话默认只读，push 会 403
permissions:
  contents: write

jobs:
  # 兜底批次专用：数据已经齐了就不要再跑一遍 39 分钟的流水线。
  # 主批次不探测——16:35 那会儿当天数据必定还没到，问了也是白问。
  probe:
    if: github.event.schedule == '0 13 * * 1-5'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    outputs:
      need: ${{ steps.chk.outputs.need }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 判断要不要跑
        id: chk
        run: node tools/probe_fresh.mjs

  build:
    needs: [probe]
    # probe 自己挂掉时 outputs 是空的，若只看 need=='true' 就会静默跳过、白丢一天。
    # 所以再加一条：probe 没成功也照跑（跑一次的成本远低于缺一天）。
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || github.event.schedule != '0 13 * * 1-5' || needs.probe.outputs.need == 'true' || needs.probe.result != 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # ---------- 1. 拉全市场历史数据 ----------
      # node:sqlite 是 Node 22+ 内置，不需要装任何依赖
      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 拉取日线（1717 只，约 9 分钟）
        working-directory: data
        run: node import_etf.mjs --out etf.db --delay 60
        env:
          NODE_NO_WARNINGS: '1'

      # 新浪的当天 K 线要等到深夜、甚至次日才出：2026-11-11 18:35 实测，
      # 四只代表标的的最新 bar 都还停在 11-10，而东财已经是 11-11。
      # 不补这一根，整条链（因子、K 线、份额轴）就永远慢一天。
      # 失败不判红：这是补丁，主数据仍由新浪负责，缺口留给兜底批次。
      - name: 补齐当天日线（东财快照）
        continue-on-error: true
        working-directory: data
        run: node backfill_today.mjs --db etf.db
        env:
          NODE_NO_WARNINGS: '1'

      - name: 数据完整性断言
        working-directory: data
        run: |
          python3 - <<'PY'
          import sqlite3, sys
          db = sqlite3.connect('etf.db')
          n_etf = db.execute('SELECT COUNT(*) FROM etf_meta').fetchone()[0]
          n_row = db.execute('SELECT COUNT(*) FROM etf_daily').fetchone()[0]
          last  = db.execute('SELECT MAX(date) FROM etf_daily').fetchone()[0]
          print(f'ETF {n_etf} 只 / 日线 {n_row:,} 条 / 最新 {last}')
          # 数据集在 2026-11 约 1717 只；低于 1500 只说明上游大面积失败，
          # 宁可让流水线红掉，也不要把残缺数据覆盖到线上
          assert n_etf > 1500, f'ETF 数量异常: {n_etf}'
          assert n_row > 1_200_000, f'日线数量异常: {n_row}'
          PY

      # ---------- 2. 算指标与因子 ----------
      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          # 必须指定依赖文件，否则 setup-python 算不出 cache key 会直接失败
          cache: pip
          cache-dependency-path: alpha/requirements.txt

      - name: 安装依赖
        run: pip install -r alpha/requirements.txt

      - name: 计算 56 指标 + 101 因子（约 4 分钟）
        working-directory: alpha
        run: python -u compute.py --db ../data/etf.db --out ../dist

      # 因子值每天重算：compute.py 已经把 101 个因子在 1717 只上全部重算过一遍。
      # 但「因子研究」页面的 IC 检验和样本外回测还要再跑这一步——
      # 它读 dist/etf/*.parquet 做横截面相关聚类，产出入选组合与回测表。
      - name: 因子聚类与样本外回测
        working-directory: alpha
        run: python -u select_factors.py --dist ../dist

      - name: 生成页面用的研究数据（5KB）
        run: node tools/gen_research.mjs

      - name: 输出体积检查
        run: |
          du -sh dist dist/etf dist/hist
          python3 - <<'PY'
          import json, pathlib
          m = json.loads(pathlib.Path('dist/manifest.json').read_text())
          h = m.get('hist') or {}
          print(f"标的 {m['codes']} 只 / 字段 {m['field_count']} 个 / 最新 {m['last_trade_date']}")
          print(f"历史二进制 {h.get('files')} 个 / {h.get('bytes',0)/1024/1024:.1f} MB / 格式 {h.get('format')} / 列 {len(h.get('cols') or [])}")
          # 历史面板依赖这份文件，缺了页面会静默没图，所以在 CI 里就卡住
          assert h.get('format') == 'ETH1', 'hist 格式标记缺失'
          assert h.get('files') == m['codes'], f"hist 文件数 {h.get('files')} != 标的数 {m['codes']}"
          assert h.get('bytes', 0) > 10e6, 'hist 总体积异常偏小'
          PY

      # 跟踪指数映射是盯盘页「同指数去重」、「赛道→ETF」、PCF 预热的依据。
      # 以前是季度手动重跑，结果新上市的 ETF 要等有人想起来才进表——这期间它们
      # 各自成一组的独立行，同一只指数在榜单里重复出现，去重数字也对不上。
      # 现在每天收盘后增量补一次：只抓 manifest 里还没有的代码（当天新上市那几只，
      # 十几秒），抓完重新生成 idx_data.js。
      #
      # 放在「板块日档回算」之前：gen_sec_hist.mjs import 的就是 idx_data.js，
      # 顺序反过来会让当天的板块日档还是旧分组。
      # 失败不能带崩主流程——映射落后一天的代价只是新 ETF 暂不去重，不是错数。
      - name: 增量补齐跟踪指数映射
        id: idxmap
        continue-on-error: true
        run: |
          node pipeline/fetch_index_map.mjs
          node pipeline/gen_idx_data.mjs
          # 两条脚本都是幂等的：内容没变不写盘，所以这里非空 = 真的有新 ETF 进来
          if git diff --quiet -- pipeline/index_map.json worker/src/idx_data.js; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "映射无变化，跳过提交与重部署"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git --no-pager diff --stat -- pipeline/index_map.json worker/src/idx_data.js
          fi

      # 覆盖度体检：正常情况每天补完就是 98% 上下。掉下去只有两种可能——
      # 上游限流导致上面那步大面积抓失败，或者真的涌进来一批新 ETF。
      - name: 指数映射覆盖率检查
        run: |
          python3 - <<'PY'
          import json, pathlib
          man = json.loads(pathlib.Path('dist/manifest.json').read_text())
          src = json.loads(pathlib.Path('pipeline/index_map.json').read_text())
          idx = src['map']
          codes = [it['code'] for it in man['items']]
          hit = sum(1 for c in codes if (idx.get(c) or {}).get('idx'))
          rate = hit / len(codes)
          print(f"跟踪指数已知 {hit}/{len(codes)} = {rate:.1%}（映射生成于 {src['generated_at'][:10]}）")
          print(f"未收录 {len(codes) - hit} 只 → 这些不做同指数去重，会各自单独成行")
          if rate < 0.95:
              print('::warning::覆盖度低于 95%，多半是增量抓取被限流了，看「增量补齐跟踪指数映射」那步的日志')
          PY

      # 板块地图要的两份「历史」，都不依赖任何人打开页面：
      #   sec_daily.json  —— 90 天 × 36 格的绝对成交额（资金箭头的基准）
      #   mkt_hist.json   —— 250 天的全 A 集中度 / 宽度（四象限的散点云）
      # 后者是逐只个股回算的：5563 只 A 股各拉一次日 K，8 并发约 1-2 分钟。
      # 以前前者靠浏览器收盘后写 KV（没人开页面就没那天），后者靠手动跑脚本提交源码。
      # 这两步是「锦上添花」，不能因为它失败把整个数据发布带下来——
      # 东财的板块接口限流比 ETF 行情狠，被限一次就红掉，等于当天的 K 线也没了。
      # 失败就沿用 data 分支上上一次的那份，页面照常显示（只是那天的点不动）。
      - name: 回算板块日档与全 A 结构
        continue-on-error: true
        run: |
          # 以前这里带 --json-only：只出 data 分支那份 json，源码模块留着不动。
          # 但页面的「板块占比走势」和「全 A 散点云」读的是 worker/src/*.js 里
          # 内联进去的那份常量，不是运行时拉 json——于是页面永远停在最后一次
          # 手提交的那天（2026-11-11 体检报「散点停在 11-06」，Actions 天天跑着）。
          # 现在两个产物都生成，下面「回写内联快照」那步负责把它们送到 main。
          node pipeline/gen_sec_hist.mjs || echo "::warning::日档回算失败，沿用上一次发布的那份"
          node pipeline/gen_mkt_hist.mjs || echo "::warning::全A结构回算失败，沿用上一次发布的那份"
          python3 - <<'PY'
          import json, pathlib
          d = json.loads(pathlib.Path('dist/sec_daily.json').read_text())
          m = json.loads(pathlib.Path('dist/mkt_hist.json').read_text())
          print(f"日档 {len(d['days'])} 天 × {len(d['days'][-1]['s'])} 格，最新 {d['last_trade_date']}")
          print(f"全A结构 {len(m['d'])} 天，行业 {m['inds']} 个，最新 {m['last_trade_date']}，"
                f"{m['u'][-1]} 涨 {m['w'][-1]} 跌")
          assert len(d['days']) >= 60, '日档不足 60 天'
          assert len(m['d']) >= 200, '全A结构历史不足 200 天'
          # 家数数组和日期必须同长，否则前端按索引取会错位到别的日子
          assert len(m['u']) == len(m['d']) and len(m['w']) == len(m['d']), '涨跌家数与日期长度不一致'
          # 全 A 有成交的股票常年在 4500-5500 之间。低于 3000 说明上游限流捞漏了
          assert m['u'][-1] + m['w'][-1] > 3000, f"个股家数异常偏少 {m['u'][-1]}+{m['w'][-1]}"
          PY

      # ---------- 3. 期指期权日档 ----------
      # 中金所只给「单日全品种」一个 XML（539KB / 788 合约），没有批量历史接口，
      # 所以 250 天基线是逐日回补出来的：每天跑的时候只补缺的那几天（通常就今天）。
      # data 分支是 force push，每次都从零开始——所以先把上一版取回来再 upsert，
      # 否则每天发布出去的都只有当天一天的历史。
      - name: 取回上一版期指日档
        continue-on-error: true
        run: |
          if git fetch -q --depth=1 origin data 2>/dev/null; then
            for f in fut_daily.json fut_last.json etfopt_hist.json; do
              if git show FETCH_HEAD:$f > /tmp/$f 2>/dev/null; then
                mv /tmp/$f dist/$f
                echo "取回 $f（$(wc -c < dist/$f) 字节）"
              else
                echo "data 分支上还没有 $f，当首次建库"
              fi
            done
          else
            echo "data 分支不存在，当首次建库"
          fi

      # 不吞异常了。脚本内部对「单日拿不到」已经 continue 容错，能走到 exit≠0 的只有
      # 真崩了或一天都没落地——那两种情况本来就该让这条链红。
      # 2026-11-09 那次就是被 continue-on-error 吞掉的：日志写着「本次补 20 天」，
      # 实际 fut_daily.json 一天没写，流水线照样成功、照样发布，页面只是悄悄退回旧档。
      - name: 生成期指期权日档（滚动 250 天）
        run: node pipeline/gen_fut_daily.mjs --backfill 250

      # ---------- 3b. ETF 期权历史 ----------
      # 中金所那份 XML 只覆盖股指期货/期权。ETF 期权在上交所/深交所，没有对应的
      # 免费归档：合约一到期就从所有源里消失（东财连 secid 都删了）。所以这里不是
      # 「按日期取历史」，而是「用今天仍在市的合约倒推」——上市早的合约自己活得很久。
      # 上面那步已经把上一版取回来了，脚本会做合并：老日期用老值，新日期才写新的。
      # 不合并的话，11 月合约到期消失后它贡献的那 28 天会被削掉，越跑越少。
      - name: 重建 ETF 期权历史
        continue-on-error: true
        run: node pipeline/etfopt_backfill.mjs

      - name: 期指日档校验
        run: |
          python3 - <<'PY'
          import json, pathlib, sys, urllib.request
          from datetime import date, datetime, timedelta

          p = pathlib.Path('dist/fut_daily.json')
          if not p.exists():
              print('::error::fut_daily.json 没生成，期指的历史、分位、四象限全退回旧值')
              sys.exit(1)
          h = json.loads(p.read_text())
          n = len(h['d'])
          print(f"期指日档 {n} 天，最新 {h.get('last_trade_date')}")
          # 数组必须和日期等长，否则前端按索引取会串到隔壁那天
          for grp in ('fut', 'opt', 'pos'):
              for prod, cols in (h.get(grp) or {}).items():
                  for k, arr in cols.items():
                      assert len(arr) == n, f'{grp}.{prod}.{k} 长度 {len(arr)} != {n}'
          for code, arr in (h.get('spot') or {}).items():
              assert len(arr) == n, f'spot.{code} 长度 {len(arr)} != {n}'
          valid = [x for x in (h['fut'].get('IF') or {}).get('bp') or [] if x is not None]
          print(f"IF 基差率样本 {len(valid)} 个，区间 {min(valid):.2f}% ~ {max(valid):.2f}%")
          for v in valid:
              assert -15 < v < 15, f'基差率 {v} 超出合理区间，多半是日期或现货对错了'
          assert n >= 60, f'历史只有 {n} 天，历史分位会失真'

          # ---- 时效：日档必须追到「最近一个已归档的交易日」 ----
          # 不按日历推：那样不知道哪天放假，长假期间会天天算出一个不存在的日子。
          # 直接问中金所——那份 XML 是收盘后生成的静态文件，「文件在」就等于
          # 「那天开市且已定稿」。探测失败（网络）只警告，不冤枉这条链。
          #
          # 判据必须是内容里有没有合约节点，不能看字节数：中金所对不存在的日期不回
          # 404，而是 302 跳到 /error_page/error_404.html——那页 2KB、HTTP 200，
          # urllib 默认跟过去，「len > 500」对任何一天都成立。2026-11-11 凌晨那次
          # 就是被这页骗了，把还没收盘的当天判成已归档，硬校验当场红掉。
          def has_xml(d):
              u = ('http://www.cffex.com.cn/sj/hqsj/rtj/%s/%s/index.xml'
                   % (d.strftime('%Y%m'), d.strftime('%d')))
              try:
                  req = urllib.request.Request(u, headers={'User-Agent': 'Mozilla/5.0'})
                  body = urllib.request.urlopen(req, timeout=20).read()
                  return b'<dailydata>' in body   # 正常 539KB / 788 条合约
              except Exception:
                  return None

          today = (datetime.utcnow() + timedelta(hours=8)).date()
          expect, unknown, d, tried = None, False, today, []
          for _ in range(8):
              if d.weekday() >= 5:
                  d -= timedelta(days=1)
                  continue
              got = has_xml(d)
              tried.append(f"{d.isoformat()}={'有' if got else '无' if got is False else '?'}")
              if got is None:
                  unknown = True
                  break
              if got:
                  expect = d
                  break
              d -= timedelta(days=1)
          print('探测：' + '  '.join(tried))

          last = date.fromisoformat(h['d'][-1])
          if unknown:
              print(f'::warning::探测不到最近交易日（中金所没应答），跳过时效校验，日档最新 {last}')
          elif expect and last < expect:
              print(f'::error::日档最新 {last}，但 {expect} 的日行情已经归档——这条链没补上')
              print('  Δ基差率和四象限会跨多日，页面看着正常但基准是错的')
              sys.exit(1)
          else:
              print(f'时效 OK：日档最新 {last}，最近交易日 {expect}')
          PY

      - name: ETF 期权历史校验
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import json, pathlib, sys
          p = pathlib.Path('dist/etfopt_hist.json')
          if not p.exists():
              print('::warning::etfopt_hist.json 没生成，页面 ETF 组会显示「还没发布」')
              sys.exit(0)
          h = json.loads(p.read_text())
          assert h.get('v') == 2, f"口径不是 v:2（真近月），拿到的是 {h.get('v')}"
          n = len(h['d'])
          print(f"ETF 期权近月 {n} 天，{h['d'][0]} ~ {h['d'][-1]}")
          for code, o in h['s'].items():
              lens = {k: len(v) for k, v in o.items()}
              assert len(set(lens.values())) == 1, f'{code} 各列长度不一致 {lens}'
              assert lens['nb'] == n, f'{code} 长度 {lens["nb"]} != {n}'
              got = [x for x in o['nb'] if x is not None]
              dts = [x for x in o['nd'] if x is not None]
              print(f"  {code}  近月 {len(got)} 天  基差率 {min(got):.2f}% ~ {max(got):.2f}%  dte {min(dts)}~{max(dts)}")
              # 当月合约的剩余天数不会超过 40 天，超了说明挑到了下月/隔季
              assert max(dts) <= 40, f'{code} dte 最大 {max(dts)} 天，不像当月合约'
              # 近月基差率贴着零收敛，正常在 ±5% 内
              for v in got:
                  assert -6 < v < 6, f'{code} 基差率 {v}% 超出合理区间'
          # 只从「今天仍在市」的当月合约倒推，天数注定不多；3 天是能出图的下限
          assert n >= 3, f'只有 {n} 天，画不出曲线'
          PY

      # ---------- 3f. 份额日档（份额 → 净申购金额） ----------
      # 份额历史留在 main（data/shares/），派生产物随 data 分支发布（dist/shares/）。
      # --fetch 先抓当日份额再算；抓不到就降级用已有轴。份额只是清单里的一列，
      # 不该因为它把整条流水线拖红，所以 continue-on-error。
      # 沪市份额按 STAT_DATE 可以回查（深市不行，断了就没了）。所以每轮先把
      # 最近几天补一遍：上交所那份报表常在 18:00 后才发布，16:35 那轮拿不到，
      # 21:00 那轮如果还是拿不到，第二天这一轮会自动补上，不需要人工干预。
      - name: 回补沪市份额
        continue-on-error: true
        run: python3 tools/sse_hist.py --days 4

      - name: 生成份额日档
        continue-on-error: true
        run: |
          # 份额依赖三四个外部接口，且东财对云 IP 会整段拒连。先把可达性打出来，
          # 出问题时不用再猜是「源没发布」还是「根本连不上」。
          echo "--- 数据源可达性 ---"
          for u in \
            'https://push2.eastmoney.com/api/qt/clist/get?pn=1&pz=2&po=1&np=1&fltt=2&invt=2&fid=f12&fs=b:MK0021&fields=f12,f38' \
            'https://www.szse.cn/api/report/ShowReport/data?SHOWTYPE=JSON&CATALOGID=1945&PAGENO=1' \
            'https://query.sse.com.cn/commonQuery.do?sqlId=COMMON_SSE_ZQPZ_ETFZL_XXPL_ETFGM_SEARCH_L&pageHelp.pageSize=5&pageHelp.pageNo=1' \
            'https://hq.sinajs.cn/list=sh510300' ; do
            printf '%-52s ' "$(echo "$u" | cut -c1-52)"
            curl -s -o /tmp/probe.bin -w '%{http_code} %{size_download}B %{time_total}s\n' -m 15 \
              -H 'User-Agent: Mozilla/5.0' -H 'Referer: https://www.szse.cn/' "$u" || echo 'CONN-FAIL'
          done
          echo "--- 开始抓取 ---"
          node pipeline/gen_shares.mjs --fetch
          echo "--- 产物 ---"
          du -sh dist/shares | cut -f1
          ls dist/shares | wc -l

      # ---------- 4. 发布历史数据 ----------
      # 默认走 GitHub 自己的 data 分支：不需要 R2、不需要绑卡、不需要配 secret。
      # 每次都是「孤儿单提交 + force push」，所以仓库不会一天涨 62MB。
      # Worker 用 HIST_BASE 指向这个分支的 raw 地址即可。
      - name: 发布到 data 分支
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          PUB=/tmp/pub
          mkdir -p "$PUB"
          cp -r dist/hist "$PUB/"
          cp dist/manifest.json "$PUB/"
          cp dist/research.json "$PUB/"
          # 首次跑或回算失败时这几个文件可能不存在，别让 cp 把发布带崩。
          # etfopt_hist.json 千万别漏：这个分支是每次 force push 重建的，
          # 少拷一个文件等于把它从线上删掉，页面 ETF 组会直接退回「还没发布」。
          for f in sec_daily.json mkt_hist.json fut_daily.json fut_last.json etfopt_hist.json; do
            if [ -f "dist/$f" ]; then cp "dist/$f" "$PUB/"; else echo "::warning::dist/$f 不存在，这轮不发布它"; fi
          done
          if [ -d dist/shares ]; then cp -r dist/shares "$PUB/"; else echo "::warning::dist/shares 不存在，这轮不发布份额"; fi
          cd "$PUB"
          git init -q
          git config user.name "etf-board-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "data $(date -u '+%Y-%m-%d %H:%M UTC')"
          git branch -M data
          git push -q --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
          echo "data 分支 $(git rev-parse --short HEAD)，$(du -sh "$PUB" | cut -f1)，" \
               "$(ls "$PUB"/hist | wc -l) 个 hist"
          python3 -c "import json;d=json.load(open('$PUB/research.json'));print('因子研究数据:',d['generated_at'],'因子',d['ic']['n'],'个')"

      # ---------- 4b. 把内联快照回写 main ----------
      # worker/src/mkt_hist.js、sec_hist.js 不是运行时拉取的，是构建 Worker 时由
      # build.mjs 直接拼进 HTML 的常量。上面「回算」只在 runner 上生成它们，不回写
      # 就等于白算：data 分支的 json 天天新，页面里的散点云却停在最后一次手提交的
      # 那天。2026-11-11 体检报「全 A 散点停在 11-06」，Actions 其实天天在跑。
      # 只有内容真变了才提交；GITHUB_TOKEN 的 push 不会触发 deploy-worker
      # （GitHub 防递归约定），所以下面必须自己 deploy 一次。
      - name: 回写内联快照
        id: snap
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "etf-board-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          FILES="worker/src/mkt_hist.js worker/src/sec_hist.js"
          if git diff --quiet -- $FILES; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "内联快照无变化（回算失败时会走到这里，属正常降级）"
            exit 0
          fi
          git diff --stat -- $FILES
          echo "--- 其它脏文件（rebase 会因它们失败）---"
          git status --porcelain | grep -v -E 'src/(mkt_hist|sec_hist)\.js' | head -10 || true
          ( cd worker && node build.mjs && node --check dist/worker.js )
          git add $FILES worker/dist/worker.js
          git commit -q -m "chore(data): 内联快照跟随 $(date -u '+%Y-%m-%d') 回算结果"
          # 工作区里常常躺着别的步骤写下的脏文件（比如「生成份额日档」会改
          # data/shares/*.json）。rebase 要求工作区干净，直接跑会被顶回来，
          # 报出来的却是「与 main 冲突」，很容易误判。autoStash 让它自己 stash/pop。
          git config rebase.autoStash true
          ok=0
          for i in 1 2 3; do
            git fetch -q --depth=20 origin main
            if ! git rebase -q origin/main; then
              echo "--- 放弃前的工作区状态 ---"
              git status --porcelain | head -20
              git rebase --abort || true
              echo "::warning::提交没能重放到最新 main（真冲突或 stash 恢复失败），放弃本次提交（明天会再补一次）"
              break
            fi
            if git push -q origin HEAD:main; then ok=1; break; fi
            echo "第 $i 次推送失败，5 秒后重试"; sleep 5
          done
          [ "$ok" = "1" ] || { echo "::error::快照提交推送失败"; exit 1; }
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "已推送 $(git rev-parse --short HEAD)"

      - name: 部署 Worker（快照已变）
        id: snapdeploy
        if: steps.snap.outputs.changed == 'true'
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy

      # 推送成功、部署失败要撤回：否则仓库里是新快照、线上还是旧的，而第二天
      # git diff 干净会跳过提交，永远卡在这个状态且没人发现。
      - name: 部署失败则回滚快照提交
        if: steps.snap.outputs.changed == 'true' && steps.snapdeploy.outcome == 'failure'
        run: |
          git revert --no-edit HEAD
          ok=0
          for i in 1 2 3; do
            if git push -q origin HEAD:main; then ok=1; break; fi
            sleep 5
          done
          [ "$ok" = "1" ] || echo "::error::回滚也推不上去，手工处理"
          echo "::warning::Worker 部署失败，已回滚快照提交"

      # ---------- 4c. 回写份额历史 ----------
      # 份额是「只能往前长」的东西：深市历史只有用户导的那一份，之后全靠每天收盘后
      # 从东财 f38 采一次。不回写 main，就等于每天都从同一个起点重抓，断一天就永远断。
      # 不回写 Worker：份额不影响任何内联常量，没必要为它重新部署。
      - name: 回写份额历史
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "etf-board-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          FILES="data/shares/sz_hist.json data/shares/sh_hist.json"
          if git diff --quiet -- $FILES; then
            echo "份额历史无变化（抓取失败或轴上已是最新）"
            exit 0
          fi
          git diff --stat -- $FILES
          git add $FILES
          git commit -q -m "data(shares): 追加 $(date -u '+%Y-%m-%d') 份额"
          # 工作区里常常躺着别的步骤写下的脏文件（比如「生成份额日档」会改
          # data/shares/*.json）。rebase 要求工作区干净，直接跑会被顶回来，
          # 报出来的却是「与 main 冲突」，很容易误判。autoStash 让它自己 stash/pop。
          git config rebase.autoStash true
          ok=0
          for i in 1 2 3; do
            git fetch -q --depth=20 origin main
            if ! git rebase -q origin/main; then
              echo "--- 放弃前的工作区状态 ---"
              git status --porcelain | head -20
              git rebase --abort || true
              echo "::warning::提交没能重放到最新 main（真冲突或 stash 恢复失败），放弃本次提交"
              break
            fi
            if git push -q origin HEAD:main; then ok=1; break; fi
            sleep 5
          done
          if [ "$ok" = "1" ]; then
            echo "已推送 $(git rev-parse --short HEAD)"
          else
            echo "::warning::份额历史推送失败，当天份额明天重抓（可能丢一天）"
          fi

      # ---------- 5. 映射有变才回写仓库并重部署 ----------
      # idx_data.js 是「构建时固化」进页面的（不额外发请求），所以补了映射必须重新部署
      # 才生效。dist/worker.js 是网页粘贴部署用的单文件，必须跟源码同一次提交落地，
      # 否则下次谁手动部署一次，就把今天补进来的 ETF 又抹掉了。
      - name: 提交映射变更
        id: idxcommit
        if: steps.idxmap.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config user.name "etf-board-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 单文件产物跟着重建（部署用的是 src/index.js，这份只是给人粘贴用的）
          ( cd worker && node build.mjs && node --check dist/worker.js )
          git add pipeline/index_map.json worker/src/idx_data.js worker/dist/worker.js
          git commit -q -m "chore(idx): 增量补齐跟踪指数映射 $(date -u '+%Y-%m-%d')"
          git config rebase.autoStash true
          ok=0
          for i in 1 2 3; do
            # 先把提交重放到最新 main 上再推：checkout 的是开工那一刻的 main，
            # 这十几分钟里有人推过代码的话，直接 push 会被 non-fast-forward 顶回来。
            git fetch -q --depth=20 origin main
            if ! git rebase -q origin/main; then
              echo "--- 放弃前的工作区状态 ---"
              git status --porcelain | head -20
              git rebase --abort || true
              echo "::warning::提交没能重放到最新 main（真冲突或 stash 恢复失败），放弃本次提交（明天会再补一次）"
              break
            fi
            if git push -q origin HEAD:main; then ok=1; break; fi
            echo "第 $i 次推送失败，5 秒后重试"; sleep 5
          done
          [ "$ok" = "1" ] || { echo "::error::映射提交推送失败"; exit 1; }
          echo "已推送 $(git rev-parse --short HEAD)"

      # 推送成功才部署：反过来的话线上会跑到仓库前面，下次有人部署就回退了。
      # 用 GITHUB_TOKEN 的 push 不会触发 deploy-worker.yml（GitHub 的防递归约定），
      # 所以这里自己调用一次 wrangler，而不能指望 push 去触发。
      - name: 重新部署 Worker（映射已变）
        id: idxdeploy
        if: steps.idxmap.outputs.changed == 'true' && steps.idxcommit.outcome == 'success'
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy

      # 部署失败必须把提交撤回去。否则仓库里是新映射、线上还是旧的，而第二天流水线
      # 看到 git diff 是干净的会直接跳过——永远卡在这个「仓库已更新、线上没更新」的状态，
      # 谁也不会发现。回滚之后第二天它会当成新变更再试一次。
      - name: 部署失败则回滚提交
        if: steps.idxdeploy.outcome == 'failure'
        run: |
          git revert --no-edit HEAD
          ok=0
          for i in 1 2 3; do
            if git push -q origin HEAD:main; then ok=1; break; fi
            git fetch -q --depth=20 origin main && git -c rebase.autoStash=true rebase -q origin/main || true
            sleep 5
          done
          [ "$ok" = "1" ] && echo "::warning::Worker 部署失败，已回滚映射提交，明天重试" \
            || echo "::error::部署失败且回滚推送不成功，需要人工看一眼"

      # ---------- 6. 可选：同步到 R2 ----------
      # 只有在仓库变量 USE_R2=true（且配了那 4 个 secret）时才跑。
      # R2 比 GitHub raw 快，但开通要绑卡——不绑卡就跳过，不影响任何功能。
      - name: 同步到 Cloudflare R2（可选）
        if: ${{ vars.USE_R2 == 'true' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          aws s3 sync dist/ "s3://$R2_BUCKET/" \
            --endpoint-url "$R2_ENDPOINT" \
            --no-progress \
            --exclude "*.pyc"

      - name: 汇总
        if: always()
        env:
          IDX_OUTCOME: ${{ steps.idxmap.outcome }}
          IDX_CHANGED: ${{ steps.idxmap.outputs.changed }}
          IDX_COMMIT: ${{ steps.idxcommit.outcome }}
          IDX_DEPLOY: ${{ steps.idxdeploy.outcome }}
        run: |
          if [ "$IDX_OUTCOME" != "success" ]; then
            idx="抓取失败，沿用旧映射（不影响行情与因子）"
          elif [ "$IDX_CHANGED" != "true" ]; then
            idx="无变化"
          elif [ "$IDX_DEPLOY" = "success" ]; then
            idx="新增 ETF 已补，Worker 已重部署"
          elif [ "$IDX_DEPLOY" = "failure" ]; then
            idx="已补但部署失败，提交已回滚，明天重试"
          else
            idx="已补但提交没推上去（$IDX_COMMIT），明天重试"
          fi
          {
            echo "### ETF 数据更新"
            echo "- 时间：$(date -u '+%Y-%m-%d %H:%M UTC')"
            echo "- 产物：$(du -sh dist 2>/dev/null | cut -f1)"
            echo "- 跟踪指数映射：$idx"
            echo "- 状态：${{ job.status }}"
          } >> $GITHUB_STEP_SUMMARY
