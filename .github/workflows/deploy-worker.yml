name: 部署 Worker

# 为什么单独开一条流水线：
# 以前每次改 Worker 都要「生成 Token → 贴过来 → 部署 → 销毁 Token」，
# 一轮下来手都酸，Token 还会在聊天记录里留痕。改成 push 即部署之后，
# 只需要在仓库里存一个长期 Token 当 secret，之后改代码我直接推，
# 一分钟内自动上线，谁都不用再碰凭证。
#
# 前置（只需做一次）：
#   Settings → Secrets and variables → Actions → New repository secret
#     CLOUDFLARE_API_TOKEN   ← 权限：Workers Scripts:Edit + Workers KV Storage:Edit + Account Settings:Read
#     CLOUDFLARE_ACCOUNT_ID  ← d4661207d82c2945cc023c3cd208362c
# 建议这个 Token 设成「无过期」但只给上面三项权限，泄露也只能动 Workers。

on:
  push:
    branches: [main]
    # 只有动到 Worker 代码才部署，改文档/README 不触发，省 Actions 分钟数
    paths:
      - 'worker/src/**'
      - 'worker/wrangler.toml'
      - 'worker/build.mjs'
      - 'worker/package.json'
      - 'tools/gen_alpha_meta.py'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

# 同一时间只允许一个部署，避免两次 push 抢着改线上版本
concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    name: 构建并部署
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 检查 Secret 是否配好
        run: |
          missing=""
          [ -z "$CF_TOKEN" ]   && missing="$missing CLOUDFLARE_API_TOKEN"
          [ -z "$CF_ACCOUNT" ] && missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error::缺少 secret:$missing"
            echo "去 Settings → Secrets and variables → Actions 添加，然后重跑本任务。"
            exit 1
          fi
          echo "两个 secret 都在。"

      # 指纹写进源码。2026-11-20 实测：`--var BUILD:<sha>` 命令行确实收到了
      # （wrangler 打印 `- BUILD: "(hidden)"`）、版本次日也 100% 挂上了，但
      # /api/status 返回的还是上一版的 sha——同名配置项一旦在 Cloudflare 上
      # 被设过（成了 secret），之后传什么都覆盖不动，而且是静默的：不报错、
      # 不告警，只有端到端去打那一发才看得出来。
      # 写进源码就没这个问题：代码变了，跑的一定是新代码。
      - name: 注入构建指纹
        env:
          GH_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os, re, pathlib
          sha = os.environ['GH_SHA']
          p = pathlib.Path('worker/src/index.js')
          s = p.read_text(encoding='utf-8')
          s2, n = re.subn(r"^const INLINE_BUILD = .*$",
                          "const INLINE_BUILD = '%s';" % sha, s, count=1, flags=re.M)
          if n != 1:
              raise SystemExit('INLINE_BUILD 占位符没找到，不能默默部署一份没有指纹的代码')
          p.write_text(s2, encoding='utf-8')
          print('INLINE_BUILD =', sha)
          PY

      # 构建有三件事：把 page.js 的占位符换成实际 JSON、产出可手动粘贴的单文件、
      # 以及检查占位符有没有被误删（删了页面会白屏，但不会报错，最难查）。
      - name: 构建并校验
        working-directory: worker
        run: |
          node build.mjs
          node --check dist/worker.js
          ls -l dist/worker.js

      # --var BUILD 保留但不再是唯一来源：index.js 的 buildOf 优先读代码里
      # 那份，env.BUILD 只在没经过 CI 的部署里兜底。
      - name: 部署到 Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy --var BUILD:${{ github.sha }}

      # 2026-11-09 踩到的：wrangler 报 success、deployments 接口也显示最新版本
      # 100%，但 workers.dev 别名返回的还是上一个版本的代码（版本预览域名是新的）。
      # 显式再把这个版本挂一次到别名上，比在 Dashboard 里手点省事。
      # 顺序上必须在「核对」之前：反过来核对看到的是上一个版本，像没生效。
      - name: 强制把最新版本挂到 workers.dev 别名
        continue-on-error: true
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          VER=$(curl -sS -H "Authorization: Bearer $CF_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/scripts/etf-board/deployments?per_page=1" \
            | python3 -c "import json,sys;d=json.load(sys.stdin);print((d['result']['deployments'][0]['versions'] or [{}])[0].get('version_id',''))")
          echo "latest version: $VER"
          [ -n "$VER" ] || exit 0
          npx --yes wrangler@3.90.0 versions deploy "$VER@100%" --yes 2>&1 | tail -5

      # 核对「线上跑的到底是哪个版本」。换成能真判错的写法：
      #   1. CF 侧部署记录最新一条必须 100% 生效（灰度没切完等于没上线）
      #   2. 端到端打一次 /api/status，取其 build 指纹（构建时间 + commit）
      # 旧写法是拉 /content 再数关键词，那个端点要 Workers Scripts:Read，token
      # 没这项时回来的是 52 字节错误 JSON，脚本却把「命中 0 次」当结论打印——
      # 从 11-09 加上起一直是假校验，什么都没验。
      - name: 核对线上版本
        env:
          GH_SHA: ${{ github.sha }}
        run: |
          set -uo pipefail
          API="https://api.cloudflare.com/client/v4"
          SITE="https://etf-board.iniestao.workers.dev"
          fail() { echo "::error::$1"; exit 1; }

          echo "== 1/2 Cloudflare 侧部署记录 =="
          DEP=$(curl -sS --max-time 20 -H "Authorization: Bearer $CF_TOKEN" \
            "$API/accounts/$CF_ACCOUNT/workers/scripts/etf-board/deployments?per_page=1") \
            || fail "deployments 接口请求失败"
          [ "$(echo "$DEP" | jq -r '.success')" = "true" ] \
            || fail "deployments 查询失败：$(echo "$DEP" | jq -c '.errors' | head -c 200)"
          echo "$DEP" | jq -r '.result.deployments[0] |
            "created_on \(.created_on)  versions \(.versions // [] | map("\(.version_id[0:8])@\(.percentage)%") | join(", "))"'
          PCT=$(echo "$DEP" | jq -r '[.result.deployments[0].versions[]?.percentage] | max // 0')
          [ "$PCT" = "100" ] || fail "最新部署没到 100%（max=${PCT}）：灰度没切完，线上还是旧代码"

          echo "== 2/2 线上构建指纹 =="
          SHA7="${GH_SHA:0:7}"
          ST=""; B=""
          # 拿到 ≠ 拿对：workers.dev 切流量后边缘节点有几百毫秒到一两秒的收敛期，
          # 第一次打到旧节点会看到上一版。所以按「值对不对」重试，而不是按「通不通」。
          for i in 1 2 3 4; do
            ST=$(curl -sS --max-time 15 "$SITE/api/status" 2>/dev/null || true)
            B=$(echo "$ST" | jq -r '.build // empty' 2>/dev/null || true)
            echo "第 ${i} 次：线上 build = ${B:-（空）}    本次 commit = $SHA7"
            case "$B" in
              *"$SHA7"*) break ;;
            esac
            [ "$i" -lt 4 ] && sleep 6
          done
          [ -n "$ST" ] || fail "线上 /api/status 拿不到：workers.dev 挂了，或路由没开"
          [ -n "$B" ] || fail "线上 /api/status 没有 build 字段——跑的还是没指纹的旧代码"
          case "$B" in
            *"$SHA7"*) echo "✓ 线上跑的就是本次构建" ;;
            *__BUILD_V__*) fail "线上 build 还是占位符：注入指纹那一步没生效" ;;
            *) fail "线上不是本次代码：build=$B，期望包含 $SHA7（命令行收到 --var、版本也 100% 了、值却没变 = 配置层旧值盖住了代码，见 buildOf 注释）" ;;
          esac

      # secrets 不会被 deploy 覆盖，但代码改动有可能忘配新变量，
      # 这里只做提醒不回显值，避免把口令打进日志。
      - name: 部署后提醒
        run: |
          echo "线上地址：https://etf-board.iniestao.workers.dev"
          echo "ACCESS_PASS 由 Cloudflare 侧 secret 管理，本次部署不会改动它。"
          echo "若页面显示 503 设置说明页，说明这个 secret 不在了，需要重新添加。"
