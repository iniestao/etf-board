name: 线上探测

# 为什么需要：Worker 部署在 Cloudflare，沙箱里访问不了 workers.dev（出口被挡），
# 只能借 GitHub runner 的出口去摸一下线上到底活没活。
# 改完 Worker 想确认「线上真的生效了」时手动跑一次，不参与任何定时任务。

on:
  workflow_dispatch:
    inputs:
      path:
        description: 要探测的路径（不带域名）
        required: false
        default: /

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: 摸一下
        env:
          BASE: https://etf-board.iniestao.workers.dev
          P: ${{ inputs.path }}
          PASS: ${{ secrets.ACCESS_PASS }}
        run: |
          echo "GET $BASE$P"
          # 想把 /api/* 探到底就得先过口令门禁：跟浏览器一样表单 POST /__auth
          # 拿 Cookie。没配 ACCESS_PASS 就按未登录走，只看 401 也是有效信息。
          CK=''
          if [ -n "$PASS" ]; then
            CK=$(curl -sS -D - -o /dev/null --max-time 20 -X POST -d "p=$PASS" "$BASE/__auth" \
                 | tr -d '\r' | grep -i '^set-cookie:' | head -1 | sed 's/^[Ss]et-[Cc]ookie: //' | cut -d';' -f1) || true
            if [ -n "$CK" ]; then echo "已登录（Cookie ${CK:0:12}…）"; else echo "登录失败，按未登录继续"; fi
          fi
          HDR=()
          [ -n "$CK" ] && HDR=(-H "Cookie: $CK")
          # 有些 runner 的 DNS 解析不了 *.workers.dev，退回 DoH 再试一次
          code=$(curl -sS "${HDR[@]}" -D /tmp/hdr -o /tmp/body -w '%{http_code}' --max-time 20 "$BASE$P" 2>/tmp/err) || true
          if [ "$code" = "000" ]; then
            echo "直连没解析出来，换 DoH 再试"
            code=$(curl -sS "${HDR[@]}" -D /tmp/hdr --doh-url https://cloudflare-dns.com/dns-query -o /tmp/body -w '%{http_code}' --max-time 25 "$BASE$P" 2>/tmp/err) || true
          fi
          echo "HTTP [$code]"
          echo "--- 响应头（看 cf-cache-status / etag） ---"
          grep -iE "^(cf-cache-status|etag|cache-control|content-length|age|last-modified):" /tmp/hdr || true
          echo "--- curl 诊断 ---"
          cat /tmp/err || true
          echo "--- 前 2000 字节 ---"
          head -c 2000 /tmp/body || true
          echo
          # 部署到底生没生效，看响应体里有没有新代码的特征串最直接
          echo "--- 关键字命中 ---"
          echo "body 字节：$(wc -c < /tmp/body 2>/dev/null || echo 0)"
          for kw in 期指期权 futHistSvg futprobe serveFut; do
            printf '%s: %s\n' "$kw" "$(grep -c -- "$kw" /tmp/body 2>/dev/null || true)"
          done
          echo
          echo "--- 判定 ---"
          case "$code" in
            401) echo "✅ 服务正常：口令门禁在工作（未登录看到 401 就是对的）" ;;
            200) echo "✅ 服务正常：200" ;;
            429) echo "⚠️ 429：撞限流/额度封禁，看 Cloudflare 用量面板" ;;
            000) echo "❌ 连不上：可能部署失败或域名不通" ;;
            *)   echo "⚠️ 非预期状态码 $code" ;;
          esac
